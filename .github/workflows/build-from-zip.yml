name: Build APK from zip
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(ls *.zip | head -1)
          mkdir proj && unzip -q "$Z" -d proj
          D=$(dirname "$(find proj -name settings.gradle | head -1)")
          echo "DIR=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Download PDF libraries
        run: |
          mkdir -p $DIR/app/src/main/assets/libs && cd $DIR/app/src/main/assets/libs
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSLO $B/pdf.js/3.11.174/pdf.min.js
          curl -fsSLO $B/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSLO $B/pdf-lib/1.17.1/pdf-lib.min.js
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
